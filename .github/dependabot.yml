version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: terraform
    directories: [/bootstrap, /infra]
    schedule:
      interval: monthly
  # Direct dependencies only. The requirements files are generated by `uv pip compile`
  # (see README); bumping a transitive pin on its own can break the lock, as when
  # python-dateutil 4 was proposed although botocore requires <3.
  - package-ecosystem: pip
    directory: /lambdas
    schedule:
      interval: monthly
    allow:
      - dependency-type: direct
