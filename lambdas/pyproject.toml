[project]
name = "henrywebsite-auth"
version = "0.1.0"
description = "Email magic-link sign-in for henryashton.dev: issues CloudFront signed cookies."
requires-python = ">=3.12,<3.13"
# Bundled into the Lambda package. boto3 is provided by the Lambda runtime.
dependencies = [
  "cryptography==50.0.2",
  "email-validator==2.4.0",
  "pydantic==2.14.4",
]

[project.optional-dependencies]
dev = [
  "boto3==1.44.9",
  "boto3-stubs[dynamodb,sesv2,ssm]==1.44.9",
  "moto[dynamodb,ses,sesv2,ssm]==5.2.5",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "ruff==0.17.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S303", "ANN"]

[tool.mypy]
strict = true
files = ["src", "tests", "build.py"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["moto", "moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
